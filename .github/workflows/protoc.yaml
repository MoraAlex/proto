name: "Protocol Buffer Go Stubs Generation"
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (ej. v1.2.6)'
        required: true
        default: 'v1.2.6'

permissions:
  contents: write

jobs:
  protoc:
    name: "Generate"
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        service: ["order", "payment"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.x'

      - name: Extract Release Version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          fi

      - name: "Generate for Golang"
        shell: bash
        run: |
          chmod +x "${GITHUB_WORKSPACE}/protoc.sh"
          ./protoc.sh ${{ matrix.service }} ${{ env.RELEASE_VERSION }} ${{ github.actor }} ${{ github.actor }}@users.noreply.github.com
