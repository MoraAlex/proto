name: "Protocol Buffer Go Stubs Generation"
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Permite dispararlo manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  protoc:
    name: "Generate"
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # Evita colisiones de push entre servicios concurrentes
      matrix:
        service: ["order", "payment"] # Agrega "shipping" cuando crees sucarpeta y .proto
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract Release Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: "Generate for Golang"
        shell: bash
        run: |
          chmod +x "${GITHUB_WORKSPACE}/protoc.sh"
          ./protoc.sh ${{ matrix.service }} ${{ env.RELEASE_VERSION }}
          ${{ github.actor }} ${{ github.actor }}@users.noreply.github.com
