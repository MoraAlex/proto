syntax = "proto3";

option go_package = "github.com/huseyinbabal/microservices-proto/payment";

message CreateRequest {
    int64 user_id = 1;
    int64 order_id = 2;
    float total_price = 3;
}

message CreateResponse {
    int64 payment_id = 1;
    int64 bill_id = 2;
}

service PaymentService {
    rpc Create(CreateRequest) returns (CreateResponse){}
}
