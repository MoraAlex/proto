syntax = "proto3";

option go_package = "github.com/MoraAlex/proto/order";

message CreateRequest {
    int64 user_id = 1;
    repeated OrderItem order_items = 2;
}

message OrderItem {
    string product_code = 1;
    float unit_price = 2;
    int32 quantity = 3;
}

message CreateResponse {
    int64 order_id = 1;
}

message GetRequest {
    int64 order_id = 1;
}

message GetResponse {
    int64 user_id = 1;
    repeated OrderItem order_items = 2;
}

service OrderService {
    rpc Create(CreateRequest) returns (CreateResponse){}
    rpc Get(GetRequest) returns (GetResponse){}
}
